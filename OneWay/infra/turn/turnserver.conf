# OneWay coturn config — production.
#
# Uses TURN REST API auth (use-auth-secret + static-auth-secret) so the
# Express backend can mint short-lived ephemeral credentials. No long-term
# usernames live on disk.
#
# Replace the two REQUIRED placeholders below before first boot:
#   - external-ip
#   - static-auth-secret  (or set via TURN_SHARED_SECRET env via systemd unit)
# Everything else is safe to leave.

# ---- Listening ----------------------------------------------------------
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
# IPv6 — uncomment if your VPS has a routable v6 address.
# listening-ip=::

# Public IP of the VPS. coturn rewrites the candidate addresses it advertises
# to peers using this. REQUIRED — coturn won't work behind a NAT without it.
# If your VPS sits behind a 1:1 NAT (e.g. some clouds), use the form
#   external-ip=PUBLIC_IP/PRIVATE_IP
external-ip=REPLACE_WITH_VPS_PUBLIC_IP

# ---- Relay --------------------------------------------------------------
# UDP port range coturn hands out for media relays. Keep this in sync with
# the firewall rules in deploy.sh. Widen later by editing both places.
min-port=49160
max-port=49200

# ---- Auth ---------------------------------------------------------------
# REST-API style auth: backend computes username = "<unix-expiry>:<userId>"
# and password = base64(HMAC-SHA1(static-auth-secret, username)).
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SHARED_SECRET

# Realm shown in 401 challenges. Must match what the client expects when
# parsing TURN URLs.
realm=turn.oneway.app

# Reject credentials older than this many seconds. Combined with REST-API
# expiry stamps, this gives a hard cap on credential lifetime.
stale-nonce=600

# ---- TLS ----------------------------------------------------------------
# Let's Encrypt certs mounted from ./certs on the host. deploy.sh wires
# certbot's renewal hook to copy fresh files and HUP the container.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
# Modern cipher suites only.
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:!aNULL:!MD5:!RC4"
no-tlsv1
no-tlsv1_1
dh2066

# ---- Hardening ----------------------------------------------------------
# Drop privileges to this UID/GID inside the container.
proc-user=nobody
proc-group=nogroup

# No server-reflexive lookups against TURN itself — kills loops.
no-loopback-peers
no-multicast-peers
# Don't relay to RFC1918 / link-local ranges. This is the single most
# important line preventing the server from being abused as an open proxy
# into the VPS's private network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
# IPv6 equivalents.
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No CLI socket exposed. If you want one, set cli-password and bind to lo.
no-cli

# Disable legacy/insecure features we never want.
no-tcp-relay        # if you want TURN-over-TCP relays, comment this out
no-multicast-peers
mobility            # supports client IP changes (WiFi <-> LTE)
fingerprint
secure-stun

# ---- Quotas / abuse limits ---------------------------------------------
# Total concurrent allocations across the server. Bump up after capacity
# planning. With ~250 KB/s per active call, 1 Gbps NIC ≈ ~500 simultaneous
# relays before saturation; total-quota enforces a hard ceiling.
total-quota=200
# Per-username (per-call) quota. Stops a single allocation from monopolizing.
user-quota=12
# Bandwidth ceiling per allocation in bytes/sec. 0 = unlimited; tighten if
# you start seeing abuse.
max-bps=0
bps-capacity=0

# ---- Logging ------------------------------------------------------------
# coturn writes to a rotating file in /var/log/coturn (mounted from host).
log-file=/var/log/coturn/turnserver.log
simple-log
no-stdout-log
# Set to 'verbose' temporarily when debugging; do NOT leave on in prod —
# verbose logs include peer addresses.
# verbose
