# OneWay API reverse proxy.
#
# Replace `api.oneway.is` with your real hostname. TLS certs come from
# certbot — `certbot --nginx -d api.oneway.is` once and the renewal
# cron handles the rest.

upstream oneway_api {
    server api:3000;
    keepalive 32;
}

# HTTP → HTTPS redirect (also serves certbot's webroot challenge if needed).
server {
    listen 80;
    listen [::]:80;
    server_name api.oneway.is;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — REST + WebSocket.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.oneway.is;

    ssl_certificate     /etc/letsencrypt/live/api.oneway.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.oneway.is/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:OneWaySSL:10m;
    ssl_session_timeout 1d;

    # Modest hardening — no leaking HSTS to browsers we never serve.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Body size — voicemail uploads cap at 5 MB; allow some headroom.
    client_max_body_size 8m;

    # WebSocket upgrade for /ws/calls.
    location /ws/ {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WS heartbeat is 25 s server-side. Keep the proxy quiet for the
        # full ping interval + slack.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # REST. Streaming voicemail audio and APNs callbacks both ride this path.
    location / {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering     off;
        proxy_read_timeout  60s;
    }
}
