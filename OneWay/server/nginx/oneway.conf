# OneWay reverse proxy.
#
# Hosts:
#   - oneway.is        : public marketing/compliance pages (served by the same Node app)
#   - api.oneway.is    : API (same upstream, different hostname)
#
# TLS certificate strategy:
# - Recommended with Cloudflare proxy: use a Cloudflare Origin Certificate and mount it into the container.
# - Alternative: use Let's Encrypt on the origin and mount /etc/letsencrypt into the container.
#
# This config expects certs at:
#   /etc/oneway/certs/oneway.is.pem
#   /etc/oneway/certs/oneway.is.key
#   /etc/oneway/certs/api.oneway.is.pem
#   /etc/oneway/certs/api.oneway.is.key
#
# Cloudflare: a 522 means Cloudflare could not connect to your origin on 443.
# Ensure nginx is running, port 443 is open, and your firewall/security-group allows it.

#
# Docker DNS: re-resolve the api container address if it changes (container recreate).
# Requires nginx 1.27.3+ for `resolve`.
#
resolver 127.0.0.11 ipv6=off valid=10s;

upstream oneway_api {
    # Required when using `resolve` so workers share resolution state.
    zone oneway_api 64k;
    server api:3000 resolve;
    keepalive 32;
}

# HTTP — LAN-only development entrypoint for iOS Simulator.
#
# The simulator resolves api.oneway.is through public DNS instead of macOS
# /etc/hosts, which makes local Xcode runs depend on router NAT hairpinning.
# Point the Debug scheme at http://<mac-lan-ip> and keep production HTTPS
# untouched.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 192.168.0.204 localhost 127.0.0.1;

    client_max_body_size 10m;

    location /ws/ {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host api.oneway.is;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location = /health {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Host api.oneway.is;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
    }

    location /api/ {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Host api.oneway.is;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
        proxy_buffering     off;
        proxy_read_timeout  60s;
    }
}

# HTTP → HTTPS redirect (also serves certbot's webroot challenge if needed).
server {
    listen 80;
    listen [::]:80;
    server_name oneway.is www.oneway.is api.oneway.is;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — public site + REST + WebSocket for oneway.is
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name oneway.is www.oneway.is;

    ssl_certificate     /etc/oneway/certs/oneway.is.pem;
    ssl_certificate_key /etc/oneway/certs/oneway.is.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:OneWaySSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    location /ws/ {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location = /health {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering     off;
        proxy_read_timeout  60s;
    }

    location / {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering     off;
        proxy_read_timeout  60s;
    }
}

# HTTPS — REST + WebSocket for api.oneway.is
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.oneway.is;

    ssl_certificate     /etc/oneway/certs/api.oneway.is.pem;
    ssl_certificate_key /etc/oneway/certs/api.oneway.is.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:OneWaySSL:10m;
    ssl_session_timeout 1d;

    # Modest hardening — no leaking HSTS to browsers we never serve.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Body size — image and voicemail uploads cap at 10 MB.
    client_max_body_size 10m;

    # WebSocket upgrade for /ws/calls and /ws/communities.
    location /ws/ {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WS heartbeat is 25 s server-side. Keep the proxy quiet for the
        # full ping interval + slack.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location = /health {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # REST. Streaming voicemail audio and APNs callbacks both ride this path.
    location /api/ {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering     off;
        proxy_read_timeout  60s;
    }

    location / {
        proxy_pass         http://oneway_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering     off;
        proxy_read_timeout  60s;
    }
}
